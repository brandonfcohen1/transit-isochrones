; Supervisord config for the single-container deploy.
; Runs MOTIS (:8080, internal) + the Next.js server (:3000, public)
; side-by-side. Both processes stream logs to the container's stdout
; so `docker logs` shows them interleaved with a [program] prefix.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
; Ensure children get SIGTERM when docker stop the container.
strip_ansi=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:motis]
command=/motis server /workspace/data
directory=/workspace
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:app]
command=node server.js
directory=/app
autostart=true
autorestart=true
startretries=5
stopasgroup=true
killasgroup=true
; Give MOTIS a head start so Next's first /api/health probe succeeds.
startsecs=3
environment=MOTIS_URL="http://127.0.0.1:8080",NODE_ENV="production",PORT="3000",HOSTNAME="0.0.0.0"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=20
